[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orkaia"
version = "0.2.0"
description = "Observability and control for AI agents in production"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["ai", "agents", "observability", "monitoring", "langchain", "crewai", "openai", "audit", "governance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.3.0"]
openai = ["openai>=1.0.0"]
all = ["langchain-core>=0.3.0", "openai>=1.0.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "httpx>=0.27.0"]

[tool.hatch.build.targets.wheel]
packages = ["orka"]

[project.urls]
Homepage = "https://orka.ia.br"
Documentation = "https://orka.ia.br/docs"
Repository = "https://github.com/mathhMadureira/orka"

[tool.pytest.ini_options]
asyncio_mode = "auto"
